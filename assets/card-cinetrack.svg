<svg width="800" height="215" viewBox="0 0 800 215" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .badge-text { font-size: 10px; font-weight: 700; fill: #bb9af7; letter-spacing: 1px; }
      .card-title { font-weight: 700; font-size: 22px; fill: #c0caf5; }
      .card-tagline { font-size: 12.5px; fill: #7aa2f7; font-weight: 500; }
      .tag-text { font-size: 10.5px; font-weight: 600; fill: #bb9af7; }
      .card-desc { font-size: 12px; fill: #c0caf5; }
      .btn-text { font-weight: 700; font-size: 11px; fill: #1a1b27; letter-spacing: 0.5px; }
      .spec-key { font-size: 11px; fill: #7aa2f7; font-weight: 500; }
      .spec-val { font-size: 11px; fill: #9ece6a; }
      .spec-accent { font-size: 11px; fill: #e0af68; }
      .tag-bg { fill: #292e42; stroke: #414868; stroke-width: 0.8; rx: 4px; }
      .proj-card { fill: url(#cardGrad); stroke: #414868; stroke-width: 1.2; rx: 14px; }
      .btn-cta { fill: #bb9af7; rx: 6px; }
    </style>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2335" />
      <stop offset="100%" stop-color="#1a1b27" />
    </linearGradient>
  </defs>

  <!-- Fundo Principal -->
  <rect width="800" height="215" class="proj-card" />

  <!-- Badge Topo Esquerdo -->
  <g transform="translate(28, 22)">
    <rect width="168" height="22" class="tag-bg" />
    <text x="84" y="15" text-anchor="middle" class="mono badge-text">⭐ FEATURED SHOWCASE</text>
  </g>

  <!-- Título e Subtítulo -->
  <text x="28" y="70" class="mono card-title">🎬 CineTrack</text>
  <text x="180" y="69" class="mono card-tagline">— Movies &amp; Series Discovery Web App</text>

  <!-- Tags de Tecnologia -->
  <g transform="translate(28, 86)">
    <rect width="64" height="22" class="tag-bg" />
    <text x="32" y="15" text-anchor="middle" class="mono tag-text">Django</text>
  </g>
  <g transform="translate(98, 86)">
    <rect width="64" height="22" class="tag-bg" />
    <text x="32" y="15" text-anchor="middle" class="mono tag-text">Python</text>
  </g>
  <g transform="translate(168, 86)">
    <rect width="82" height="22" class="tag-bg" />
    <text x="41" y="15" text-anchor="middle" class="mono tag-text">REST APIs</text>
  </g>
  <g transform="translate(256, 86)">
    <rect width="88" height="22" class="tag-bg" />
    <text x="44" y="15" text-anchor="middle" class="mono tag-text">PostgreSQL</text>
  </g>
  <g transform="translate(350, 86)">
    <rect width="100" height="22" class="tag-bg" />
    <text x="50" y="15" text-anchor="middle" class="mono tag-text">Clean Code</text>
  </g>

  <!-- Descrição -->
  <text x="28" y="132" class="mono card-desc">Web application for discovering, tracking, and cataloging movies and TV shows.</text>
  <text x="28" y="150" class="mono card-desc">Engineered with Python &amp; Django, REST API integration, and relational ORM architecture.</text>

  <!-- Botão Visual CTA -->
  <g transform="translate(28, 168)">
    <rect width="176" height="32" class="btn-cta" />
    <!-- Mini GitHub Icon -->
    <path d="M16 10a6 6 0 0 0-1.9 11.7c.3.1.4-.1.4-.3v-1.1c-1.7.4-2-.7-2-.7-.3-.7-.7-.9-.7-.9-.5-.4 0-.3 0-.3.6.1 1 .6 1 .6.5.9 1.4.7 1.8.5.1-.4.3-.7.4-.9-1.4-.2-2.8-.7-2.8-3.1 0-.7.2-1.2.7-1.7 0-.2-.3-.9.1-1.7 0 0 .5-.2 1.8.7a6.2 6.2 0 0 1 3.2 0c1.3-.9 1.8-.7 1.8-.7.4.8.1 1.5.1 1.7.5.5.7 1 .7 1.7 0 2.4-1.4 2.9-2.8 3.1.2.2.5.7.5 1.4v2.1c0 .2.1.4.4.3A6 6 0 0 0 16 10z" fill="#1a1b27" />
    <text x="96" y="20" text-anchor="middle" class="mono btn-text">VIEW REPOSITORY ➔</text>
  </g>

  <!-- Painel Lateral: Spec Box / Terminal Preview -->
  <g transform="translate(490, 22)">
    <rect width="282" height="171" rx="10" fill="#16161e" stroke="#292e42" stroke-width="1.2" />
    <!-- Dots -->
    <circle cx="16" cy="16" r="4" fill="#f7768e" />
    <circle cx="28" cy="16" r="4" fill="#e0af68" />
    <circle cx="40" cy="16" r="4" fill="#9ece6a" />
    <text x="141" y="20" text-anchor="middle" class="mono" font-size="10" fill="#565f89">cinetrack.spec.json</text>
    <line x1="0" y1="30" x2="282" y2="30" stroke="#24283b" stroke-width="1" />

    <!-- Specs JSON-like -->
    <text x="16" y="52" class="mono spec-key">"stack"<tspan fill="#c0caf5">:</tspan> <tspan class="spec-val">"Python • Django"</tspan></text>
    <text x="16" y="74" class="mono spec-key">"database"<tspan fill="#c0caf5">:</tspan> <tspan class="spec-val">"PostgreSQL • SQLite"</tspan></text>
    <text x="16" y="96" class="mono spec-key">"integrations"<tspan fill="#c0caf5">:</tspan> <tspan class="spec-val">"External REST APIs"</tspan></text>
    <text x="16" y="118" class="mono spec-key">"architecture"<tspan fill="#c0caf5">:</tspan> <tspan class="spec-val">"MTV • Django ORM"</tspan></text>
    <text x="16" y="140" class="mono spec-key">"status"<tspan fill="#c0caf5">:</tspan> <tspan class="spec-accent">"Active Development 🚀"</tspan></text>
  </g>
</svg>
